name: TecnoStock CI
on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pruebas + cobertura (>=80%)
        run: pytest
      - name: Exportar OpenAPI
        run: python scripts/export_openapi.py
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: docs/api/openapi.json
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -t tecnostock .
      - name: Pruebas dentro del contenedor
        run: docker run --rm tecnostock pytest
